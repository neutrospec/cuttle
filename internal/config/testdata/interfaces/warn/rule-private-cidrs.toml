# warn: 18 rule[1].interfaces: does not apply to loopback and private addresses
name = "cuttle-test"
[proxy]
default = "direct"

[[interface]]
name = "eth-a"
mac = "00:00:5e:00:53:0a"

[[interface]]
name = "eth-b"
mac = "00:00:5e:00:53:0b"

[[rule]]
name = "lan"
cidrs = ["10.0.0.0/8", "fd00::/8", "127.0.0.0/8"]
action = "direct"
interfaces = ["eth-b"]
