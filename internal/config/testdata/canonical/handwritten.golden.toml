# cuttle configuration. The admin UI writes this file in this form and
# replaces comments with these generated ones; the previous version is
# kept beside it with a .bak suffix. Check hand edits with `cuttle check`
# and apply them with `cuttle reload`.

name = "cuttle-edge"

# Listeners and the route for requests that no rule matches.
[proxy]
listen = ["127.0.0.1:18080", "10.8.0.6:18081"]
default = "upstream:gateway"
connect_timeout = "5s"
response_timeout = "30s"
idle_timeout = "0s"
max_connections = 2048
interfaces = ["eth-a", "wifi"]
interface_attempt_timeout = "2s"
interface_demotion = "0s"

# Clients on other machines: allowed sources, ports, and their default.
[proxy.remote]
sources = ["10.8.0.1/32", "2001:db8::/48"]
ports = []
default = "upstream:gateway"
allow_direct = false
max_connections_per_source = 64

# Admin UI; set the first password with `cuttle admin passwd`.
[admin]
listen = ""

[stats]
retention_days = 7
max_hosts_per_hour = 5000

[log]
level = "debug"

# Network interfaces, named for interface lists; `cuttle interfaces`
# lists this Mac's interfaces.
[[interface]]
name = "eth-a"
note = ""
mac = "00:00:5E:00:53:0A"
kind = "wired"

[[interface]]
name = "wifi"
device = "en0"
kind = "wifi"

# Upstream proxies. disclosure: "via" for another cuttle instance,
# "none" for an egress proxy.
[[upstream]]
name = "gateway"
note = "Gateway \"lab\" \\ path, 東京 # not a comment"
address = "GW.example:3128"
disclosure = "via"
connect_timeout = "3s"
response_timeout = "45s"
unreachable_hold = "0s"
interfaces = ["eth-a"]

[[upstream]]
name = "egress"
address = "203.0.113.20:3128"
disclosure = "none"

# Rules, tried in this order; the first match wins.
[[rule]]
name = "rule-1"
domains = [
  "ads.example.net",
  "tracker.example",
  "metrics.example.org",
  "beacon.example.com",
]
action = "block"

[[rule]]
name = "lan"
note = "NAS and printers"
hosts = ["nas.lan"]
cidrs = ["192.168.0.0/16", "fd00::/8"]
ports = [80, 443, 8443]
action = "direct"
allow_loopback = false
allow_private = true
interfaces = ["wifi", "eth-a"]

[[rule]]
name = "restricted"
domains = ["internal.example"]
action = "upstream:egress"

[[rule]]
name = "rule-4"
hosts = ["update.example"]
action = "direct"
